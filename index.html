    <style>
      html,
      body {
        margin: 0;

        height: 100%;
        background: #0e4a5a;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: Andika, Verdana, sans-serif;
        /* A game, not a page: no pull-to-refresh, no text selection, no long-press menu. */
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        /* No pinch-zoom, double-tap zoom or panning: every touch belongs to the game. */
        touch-action: none;
      }
      /* A tablet held upright gets a friendly card, not a tiny game. */
      #turn {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #turn {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: grid;
          place-items: center;
          align-content: center;
          gap: 20px;
          background: #0e4a5a;
          color: #fff8ea;
          text-align: center;
          font-size: 24px;
          line-height: 1.4;
          padding: 24px;
        }
        #turn svg {
          width: 120px;
          height: 120px;
        }
      }
